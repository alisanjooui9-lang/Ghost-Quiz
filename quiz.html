*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

.container{

}

    padding:14px;

    border-radius:18px;
    background:#120f09;
}

.logo{
    font-size:20px;
    font-weight:bold;
}

.stats{
    display:flex;
    gap:8px;
}

.stat{
    background:#241b0b;
    border:1px solid #80631f;
    border-radius:10px;
    padding:7px 9px;
    font-size:12px;
}

.title-box{
    text-align:center;
    padding:25px 10px 15px;
}

.crown{
    font-size:48px;
}

h1{
    font-size:25px;
    margin:8px 0;
}

.category-name{
    color:#c9b77d;
    font-size:13px;
}

.progress-wrap{
    margin:15px 0;
}

.progress-info{
    display:flex;
    justify-content:space-between;
    color:#a89563;
    font-size:12px;
    margin-bottom:7px;
}

.progress{
    height:8px;
    background:#29230f;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#8f6818,#f5d77a);
    transition:.3s;
}

.card{
    background:linear-gradient(145deg,#1b160d,#090909);
    border:1px solid #9b7625;
    border-radius:22px;
    padding:20px;
    box-shadow:0 0 30px rgba(212,167,62,.1);
}

.question{
    color:#fff2c5;
    font-size:19px;
    line-height:1.9;
    text-align:center;
    margin-bottom:20px;
}

.options{
    display:grid;
    gap:11px;
}

.option{
    width:100%;
    border:1px solid #6d541d;
    border-radius:14px;
    padding:15px;
    background:#15120c;
    color:#ead07b;
    font-family:inherit;
    font-size:14px;
    cursor:pointer;
    text-align:right;
    transition:.2s;
}

.option:hover{
    background:#2a210f;
    border-color:#b58b2b;
}

.option.correct{
    background:#17301b;
    border-color:#4caf50;
    color:#bff0c4;
}

.option.wrong{
    background:#35130f;
    border-color:#c0392b;
    color:#ffc1ba;
}

.option:disabled{
    cursor:default;
}

.feedback{
    min-height:28px;
    text-align:center;
    margin-top:16px;
    line-height:1.8;
    font-size:13px;
}

.next-btn{
    display:none;
    width:100%;
    border:0;
    border-radius:14px;
    padding:14px;
    margin-top:12px;
    background:linear-gradient(135deg,#d4af37,#8f6818);
    color:#160f04;
    font-family:inherit;
    font-weight:bold;
    cursor:pointer;
}

.next-btn.show{
    display:block;
}

.exit{
    display:block;
    text-align:center;
    text-decoration:none;
    color:#89794f;
    font-size:12px;
    margin-top:20px;
}

.result{
    text-align:center;
    padding:20px 5px;

.result-icon{
    font-size:65px;

.result h2{
    margin:10px 0;

.result p{
    color:#c9b77d;

.loading{

    padding:30px;

/* =========================
   دسته‌های مشابه
========================= */

questionBank.leaders =
    questionBank.history;

questionBank.civilizations =
    questionBank.ancient_iran;

questionBank.countries =
    questionBank.countries;

questionBank.cities =
    questionBank.cities;


/* =========================
   انتخاب سؤال‌ها
========================= */

let questions =
    questionBank[selectedCategory] ||
    questionBank.knowledge;


/* فقط 10 سؤال */

questions =
    [...questions]
    .sort(()=>Math.random()-0.5)
    .slice(0,10);


/* =========================
   متغیرهای بازی
========================= */

let currentQuestion = 0;
let score = 0;
let correctAnswers = 0;
let answered = false;


/* =========================
   نمایش آزمون
========================= */

document.getElementById("loading").style.display = "none";
document.getElementById("quizContent").style.display = "block";

document.getElementById("totalNumber").textContent =
    questions.length;

showQuestion();


/* =========================
   نمایش سؤال
========================= */

function showQuestion(){

    answered = false;

    const data =
        questions[currentQuestion];

    document.getElementById("currentNumber").textContent =
        currentQuestion + 1;

    document.getElementById("question").textContent =
        data.q;

    const options =
        document.getElementById("options");

    options.innerHTML = "";

    document.getElementById("feedback").textContent = "";

    document.getElementById("nextBtn").classList.remove("show");

    const progress =
        ((currentQuestion) / questions.length) * 100;

    document.getElementById("progressBar").style.width =
        progress + "%";


    data.o.forEach((text,index)=>{

        const button =
            document.createElement("button");

        button.className = "option";

        button.textContent =
            String.fromCharCode(1575 + index) +
            " ـ " +
            text;

        button.onclick = () =>
            answerQuestion(button,index);

        options.appendChild(button);

    });

}


/* =========================
   پاسخ
========================= */

function answerQuestion(button,index){

    if(answered) return;

    answered = true;

    const data =
        questions[currentQuestion];

    const buttons =
        document.querySelectorAll(".option");

    buttons.forEach(btn=>{
        btn.disabled = true;
    });


    if(index === data.a){

        button.classList.add("correct");

        score++;

        correctAnswers++;

        coins += 20;

        xp += 10;

        document.getElementById("feedback").innerHTML =
            "🎉 آفرین! پاسخ درست بود.<br>🪙 +20 سکه &nbsp; ⭐ +10 XP";

    }else{

        button.classList.add("wrong");

        buttons[data.a].classList.add("correct");

        document.getElementById("feedback").innerHTML =
            "❌ پاسخ اشتباه بود.<br>پاسخ درست مشخص شد.";

    }


    localStorage.setItem(
        "ghostCoins",
        coins
    );

    localStorage.setItem(
        "ghostXP",
        xp
    );

    document.getElementById("coins").textContent =
        coins;

    document.getElementById("xp").textContent =
        xp;

    document.getElementById("nextBtn").classList.add("show");

}


/* =========================
   سؤال بعدی
========================= */

function nextQuestion(){

    currentQuestion++;

    if(currentQuestion >= questions.length){

        finishQuiz();

        return;
    }

    showQuestion();

}


/* =========================
   پایان آزمون
========================= */

function finishQuiz(){

    const total =
        questions.length;

    const oldRecord =
        Number(localStorage.getItem("quizRecord")) || 0;

    const oldGames =
        Number(localStorage.getItem("quizGames")) || 0;

    const oldCorrect =
        Number(localStorage.getItem("correctTotal")) || 0;


    localStorage.setItem(
        "quizScore",
        score
    );

    localStorage.setItem(
        "quizTotal",
        total
    );

    localStorage.setItem(
        "quizRecord",
        Math.max(oldRecord,score)
    );

    localStorage.setItem(
        "quizGames",
        oldGames + 1
    );

    localStorage.setItem(
        "correctTotal",
        oldCorrect + correctAnswers
    );

    localStorage.setItem(
        "lastCategory",
        selectedCategory
    );


    document.getElementById("quizCard").innerHTML = `

        <div class="result">

            <div class="result-icon">
                ${score >= 8 ? "🏆" : score >= 5 ? "📜" : "🛡️"}
            </div>

            <h2>
                آزمون تمام شد!
            </h2>

            <p>
                امتیاز شما:
                <b>${score} / ${total}</b>
            </p>

            <p>
                پاسخ‌های صحیح:
                <b>${correctAnswers}</b>
            </p>

            <p>
                ⭐ XP فعلی:
                <b>${xp}</b>
            </p>

            <button
                class="next-btn show"
                onclick="location.href='result.html'">

                🏆 مشاهده نتیجه کامل

            </button>

        </div>

    `;

    document.getElementById("progressBar").style.width =
        "100%";

}
